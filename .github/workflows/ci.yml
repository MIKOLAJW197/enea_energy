name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        # Pin to keep CI stable across ruff major/minor releases.
        run: pip install "ruff==0.16.0"

      - name: Ruff
        run: ruff check custom_components

      - name: Syntax check
        run: python -m compileall custom_components

      - name: Verify manifest version format
        run: python scripts/verify_manifest_version.py
