name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install ruff

      - name: Validate integration
        run: |
          ruff check custom_components
          python -m compileall custom_components
          python scripts/verify_manifest_version.py --tag "${GITHUB_REF_NAME}"

      - name: Build release archive
        run: |
          mkdir -p dist
          (cd custom_components && zip -r ../dist/enea_energy.zip enea_energy)
          cp hacs.json LICENSE README.md dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/enea_energy.zip
            dist/hacs.json
            dist/LICENSE
            dist/README.md
